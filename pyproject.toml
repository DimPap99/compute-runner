[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-runner"
version = "0.5.0"
description = "Persistent local queue, Python API and CLI for compute workloads"
requires-python = ">=3.12"
dependencies = ["kaggle==2.2.4", "kagglesdk==0.1.37", "pydantic>=2,<3", "typer>=0.12,<1", "rich>=13,<15", "PyYAML>=6,<7", "pathspec>=0.12,<1", "nbformat>=5,<6"]

[project.optional-dependencies]
ssh = ["paramiko>=3.4,<5"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "paramiko>=3.4,<5"]

[project.scripts]
compute-runner = "compute_runner.cli:main"
kgr = "compute_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, import order, and McCabe complexity to keep functions small.
select = ["E", "W", "F", "B", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["compute_runner"]
known-local-folder = ["conftest"]
